name: Publish Docker Image

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-${{ github.run_number }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ghcr.io/${{ github.repository_owner }}/fetch:${{ env.VERSION }}

      - name: Tag and Push latest
        if: github.ref == 'refs/tags/v${{ env.VERSION }}'
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/fetch:${VERSION} ghcr.io/${{ github.repository_owner }}/fetch:latest
          docker push ghcr.io/${{ github.repository_owner }}/fetch:latest
