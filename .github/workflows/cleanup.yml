name: GHCR Cleanup

on:
  schedule:
    - cron: "0 2 * * *"   
  workflow_dispatch:

permissions:
  packages: write 
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup GHCR Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: true
          delete-untagged: true
          keep-n-tagged: 7
          older-than: 7 days