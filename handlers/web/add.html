<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Add Download</title>
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<div class="container mx-auto px-3 md:px-4 py-6 md:py-8">

    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 pb-6 border-b border-gray-800">

        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                <span class="text-blue-500">Fetch</span> Add
            </h1>
            <p class="text-gray-500 text-xs md:text-sm mt-1">Add New Download</p>
        </div>

        <a href="/" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm">
            Back
        </a>

    </header>

    <!-- FORM CARD -->
    <form id="add-download-form"
          class="bg-gray-900 p-4 md:p-6 rounded-2xl border border-gray-800 max-w-lg mx-auto space-y-6">

        <!-- Protocol -->
        <div>
            <label class="block text-sm font-semibold mb-2">Protocol</label>
            <div class="flex gap-6">
                <label class="flex items-center gap-2 text-sm">
                    <input type="radio" name="protocol" value="Usenet" required class="accent-blue-500">
                    Usenet
                </label>
                <label class="flex items-center gap-2 text-sm">
                    <input type="radio" name="protocol" value="Torrent" required class="accent-blue-500">
                    Torrent
                </label>
            </div>
        </div>

        <!-- Downloader -->
        <div>
            <label for="downloadType" class="block text-sm font-semibold mb-2">Downloader</label>
            <select id="downloadType" name="downloadType"
                class="w-full px-3 py-2.5 bg-gray-800 rounded-lg border border-gray-700 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option>Loading...</option>
            </select>
        </div>

        <!-- Category -->
        <div>
            <label for="category" class="block text-sm font-semibold mb-2">Category</label>
            <select id="category" name="category"
                class="w-full px-3 py-2.5 bg-gray-800 rounded-lg border border-gray-700 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option>Loading...</option>
            </select>
        </div>

        <!-- Provider -->
        <div>
            <label for="provider" class="block text-sm font-semibold mb-2">Provider</label>
            <select id="provider" name="provider"
                class="w-full px-3 py-2.5 bg-gray-800 rounded-lg border border-gray-700 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option>Select Protocol First</option>
            </select>
        </div>

        <!-- Input Type -->
        <div>
            <label class="block text-sm font-semibold mb-2">Input Type</label>
            <div class="flex gap-6">
                <label class="flex items-center gap-2 text-sm">
                    <input type="radio" name="inputType" value="url" checked class="accent-blue-500">
                    URL
                </label>
                <label class="flex items-center gap-2 text-sm">
                    <input type="radio" name="inputType" value="file" class="accent-blue-500">
                    File
                </label>
            </div>
        </div>

        <!-- URL -->
        <div id="url-field">
            <label for="urlInput" class="block text-sm font-semibold mb-2">URL</label>
            <textarea id="urlInput" name="url"
                placeholder="Paste URL..."
                class="w-full px-3 py-2.5 bg-gray-800 rounded-lg border border-gray-700 text-sm resize-none h-28 focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
        </div>

        <!-- File -->
        <div id="file-field" class="hidden">
            <label for="fileUpload" class="block text-sm font-semibold mb-2">Upload File</label>
            <input type="file" id="fileUpload" name="fileUpload"
                class="w-full text-sm bg-gray-800 border border-gray-700 rounded-lg px-3 py-2">
        </div>

        <!-- SUBMIT -->
        <button type="submit"
            class="w-full py-3 bg-green-600 hover:bg-green-500 rounded-lg text-sm font-semibold transition">
            Add Download
        </button>

    </form>

</div>

<script>
let configData = null;

async function loadConfigData() {
    try {
        const res = await fetch('/internal/api/config');
        if (!res.ok) throw new Error('Failed to fetch config');
        configData = await res.json();

        const downloadTypeSelect = document.getElementById('downloadType');
        downloadTypeSelect.innerHTML = '';
        (configData.supported_downloaders || []).forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.downloader_id;
            opt.textContent = d.downloader_name;
            downloadTypeSelect.appendChild(opt);
        });

        const categorySelect = document.getElementById('category');
        categorySelect.innerHTML = '';
        (configData.application_categories || '').split(',').map(c => c.trim()).forEach(cat => {
            if (!cat) return;
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });

    } catch (err) {
        alert('Error loading configuration');
    }
}

/* toggle input */
const inputRadios = document.querySelectorAll('input[name="inputType"]');
const urlField = document.getElementById('url-field');
const fileField = document.getElementById('file-field');

inputRadios.forEach(r => {
    r.addEventListener('change', () => {
        urlField.classList.toggle('hidden', r.value !== 'url' || !r.checked);
        fileField.classList.toggle('hidden', r.value !== 'file' || !r.checked);
    });
});

/* provider switch */
const protocolRadios = document.querySelectorAll('input[name="protocol"]');
const providerSelect = document.getElementById('provider');

protocolRadios.forEach(r => {
    r.addEventListener('change', () => {
        providerSelect.innerHTML = '';
        if (!configData) return;

        const list = r.value === 'Torrent'
            ? configData.configured_debrid_providers
            : configData.configured_usenet_providers;

        (list || []).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.debrid_provider_id || p.usenet_provider_id;
            opt.textContent = p.debrid_provider_name || p.usenet_provider_name;
            providerSelect.appendChild(opt);
        });
    });
});

/* submit */
const form = document.getElementById('add-download-form');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const protocolValue = form.querySelector('input[name="protocol"]:checked').value.toLowerCase();
    formData.set('protocol', protocolValue);

    try {
        const res = await fetch('/internal/api/add', {
            method: 'POST',
            body: formData
        });

        if (res.ok) {
            window.location.href = '/';
        } else {
            const data = await res.json().catch(() => ({}));
            alert(data.error || "Failed");
        }

    } catch (err) {
        alert("Request failed");
    }
});

loadConfigData();
</script>

</body>
</html>
