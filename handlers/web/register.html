<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Setup</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen font-sans px-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 space-y-6">

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">
                <span class="text-blue-500">Fetch</span> Setup
            </h1>
            <p class="text-gray-500 text-xs mt-1">Create your account</p>
        </div>

        <!-- Form -->
        <form action="/register" method="POST" class="space-y-4">

            <div>
                <label class="text-xs text-gray-400 mb-1 block">Username</label>
                <input type="text" name="username" required placeholder="admin"
                    class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-400 mb-1 block">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold transition">
                Create Account
            </button>

        </form>

    </div>

</body>
</html>
