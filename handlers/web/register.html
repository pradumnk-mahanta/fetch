<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch | Initial Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-gray-900 rounded-2xl border border-blue-900/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-600/10 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="UserPlusIcon" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Initial Setup</h1>
            <p class="text-gray-400 mt-2 text-sm">Create your admin account to secure Fetch</p>
        </div>

        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Admin Username</label>
                <input type="text" name="username" required placeholder="e.g. admin"
                       class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Admin Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition text-white">
            </div>

            <button type="submit" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg transition transform active:scale-95">
                Create Account & Lock App
            </button>
        </form>
    </div>
</body>
</html>
