<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Dashboard</title>
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<div class="container mx-auto px-3 md:px-4 py-6 md:py-8">

    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 pb-6 border-b border-gray-800">

        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                <span class="text-blue-500">Fetch</span> Dashboard
            </h1>
            <p class="text-gray-500 text-xs md:text-sm mt-1">
                SABnzbd and qBittorrent Proxy for Debrid Services
            </p>
        </div>

        <div class="flex flex-wrap items-center gap-2 md:gap-4">

            <div class="flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-lg">
                <span class="text-sm text-blue-400"><span id="timer">10</span>s</span>
            </div>

            <a href="/add" class="px-3 py-2 bg-green-700 hover:bg-green-600 text-white rounded-lg text-sm">
                + Add
            </a>

            <a href="/archive" class="px-3 py-2 bg-blue-800 hover:bg-blue-700 text-blue-200 hover:text-white rounded-lg text-sm">
                History
            </a>

            <a href="/settings" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-sm">
                Settings
            </a>

            <a href="/logout" class="px-3 py-2 bg-red-800 hover:bg-red-700 text-white-200 rounded-lg text-sm">
                Logout
            </a>

        </div>
    </header>

    <!-- CONTENT -->
    <div id="download-container" class="grid grid-cols-1 gap-4 md:gap-6">
        <div class="flex flex-col items-center justify-center py-20 text-gray-600">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p>Pulling latest data...</p>
        </div>
    </div>

</div>

<script>
let countdown = 10;
const container = document.getElementById('download-container');
const timerEl = document.getElementById('timer');

let openCards = new Set();

function getProtocolClass(protocol) {
    if (!protocol) return "bg-blue-900/40 text-blue-400 border-blue-800/50";

    const p = protocol.toLowerCase();
    if (p === "torrent") return "bg-green-900/40 text-green-400 border-green-800/50";
    if (p === "usenet") return "bg-yellow-900/40 text-yellow-400 border-yellow-800/50";

    return "bg-blue-900/40 text-blue-400 border-blue-800/50";
}

function getCategoryClass(category) {
    if (!category) return "bg-gray-800 text-gray-400 border-gray-700";

    const c = category.toLowerCase();

    if (c === "sonarr") return "bg-sky-500/20 text-sky-300 border-sky-400/40";
    if (c === "radarr") return "bg-yellow-500/20 text-yellow-300 border-yellow-400/40";

    return "bg-gray-800 text-gray-400 border-gray-700";
}

async function fetchData() {
    try {
        const response = await fetch('/internal/api/stats');

        if (response.status === 401) {
            window.location.href = '/';
            return;
        }

        const data = await response.json();
        renderUI(data);
        countdown = 10;

    } catch (err) {
        console.error(err);
    }
}

function renderUI(downloads) {

    const list = downloads || [];

    if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-20 bg-gray-900 rounded-2xl border border-dashed border-gray-800 text-gray-500">No active downloads found.</div>`;
        return;
    }

    container.innerHTML = list.map(dl => {

        const totalItems = dl.item_details.length;
        const completedItems = dl.item_details.filter(i => i.status === "Completed").length;

        const totalBytes = dl.item_details.reduce((acc, item) => acc + (item.file_size || 0), 0);

        const downloadedBytes = dl.item_details.reduce((acc, item) => {
            const stats = item.downloader_stats || {};
            const isFinished = item.status === "Completed" || stats.status === "Completed";

            if (isFinished) return acc + (item.file_size || 0);

            const progress = (stats.percentage || 0) / 100;
            return acc + ((item.file_size || 0) * progress);
        }, 0);

        const parentProgress = totalBytes > 0 ? ((downloadedBytes / totalBytes) * 100).toFixed(0) : 0;

        const cardId = `items-${dl.id}`;
        const isExpanded = openCards.has(cardId);

        return `
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl">

            <div onclick="toggleItems('${cardId}')"
                 class="relative p-4 md:p-6 bg-gray-900/50 hover:bg-gray-800/50 cursor-pointer">

                <button onclick="event.stopPropagation(); openMenu(event, '${dl.id}')"
                    class="absolute top-1/2 right-2 -translate-y-1/2 p-3 rounded-lg hover:bg-gray-800 text-gray-500 hover:text-white text-lg">
                    ⋮
                </button>

                <div class="pr-12">

                    <div class="flex flex-wrap items-center gap-2 mb-1">

                        <!-- Protocol -->
                        <span class="px-2 py-0.5 text-[10px] rounded border ${getProtocolClass(dl.protocol)}">
                            ${dl.protocol}
                        </span>

                        <!-- Category -->
                        <span class="px-2 py-0.5 text-[10px] rounded border ${getCategoryClass(dl.category)}">
                            ${dl.category || 'Default'}
                        </span>

                        <!-- Provider -->
                        <span class="px-2 py-0.5 bg-gray-800 text-gray-400 text-[10px] rounded border border-gray-700">
                            ${dl.provider || 'Unknown'}
                        </span>

                        <!-- Download Type -->
                        <span class="px-2 py-0.5 bg-purple-900/30 text-purple-300 text-[10px] rounded border border-purple-700">
                            ${dl.download_type || 'N/A'}
                        </span>

                    </div>

                    <h2 class="text-base md:text-xl font-semibold text-white">${dl.download_name}</h2>

                    <p class="text-xs text-gray-400 mt-1">
                        ${completedItems} / ${totalItems} files (${parentProgress}%)
                    </p>

                    <p class="text-xs mt-1 ${dl.status === 'Completed' ? 'text-green-500' : 'text-yellow-500'}">
                        ${dl.status}
                    </p>

                </div>

            </div>

            <div id="${cardId}" class="${isExpanded ? '' : 'hidden'} p-3 md:p-4 space-y-3 bg-gray-950/30 border-t border-gray-800">

                ${dl.item_details.map(item => {

                    const stats = item.downloader_stats || {};
                    const isFinished = item.status === "Completed" || stats.status === "Completed";
                    const progress = isFinished ? "100.00" : (stats.percentage || 0).toFixed(2);
                    const speed = isFinished ? "Done" : (stats.average_speed ? (stats.average_speed / 1024).toFixed(2) + " MB/s" : "0 MB/s");

                    return `
                    <div class="bg-gray-900/80 p-3 md:p-4 rounded-xl border border-gray-800">

                        <p class="text-sm text-gray-200 whitespace-normal break-words leading-snug max-w-full">
                            ${item.file_name}
                        </p>

                        <div class="flex justify-between text-[11px] mt-1 text-gray-500">
                            <span>${(item.file_size / 1024 / 1024).toFixed(1)} MB</span>
                            <span>${speed}</span>
                        </div>

                        <div class="mt-2">
                            <div class="flex justify-between text-[10px] mb-1 text-gray-500">
                                <span>${isFinished ? 'Completed' : (item.status || 'Queued')}</span>
                                <span>${progress}%</span>
                            </div>

                            <div class="w-full bg-gray-800 rounded-full h-1.5">
                                <div class="bg-blue-600 h-full" style="width:${progress}%"></div>
                            </div>
                        </div>

                    </div>`;
                }).join('')}

            </div>

        </div>`;
    }).join('');
}

/* toggle */
function toggleItems(id) {
    const el = document.getElementById(id);

    if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        openCards.add(id);
    } else {
        el.classList.add('hidden');
        openCards.delete(id);
    }
}

/* floating menu */
let activeMenu = null;

function openMenu(event, id) {
    closeMenu();

    const rect = event.target.getBoundingClientRect();

    const menu = document.createElement('div');
    menu.className = "fixed bg-gray-900 border border-gray-800 rounded-xl shadow-xl z-50 w-44";

    menu.style.visibility = "hidden";
    menu.style.top = "0px";
    menu.style.left = "0px";

    menu.innerHTML = `
        <div class="py-1">

            <button onclick="resetDownload('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Restart Download
            </button>

            <button onclick="downloadItem('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Change Downloader (Internal)
            </button>

            <button onclick="downloadSymlink('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Change Downloader (Symlink)
            </button>

            <button onclick="downloadStrm('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Change Downloader (STRM)
            </button>

            <div class="border-t border-gray-800 my-1"></div>

            <button onclick="deleteDownload('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-800">
                Delete
            </button>

        </div>
    `;

    document.body.appendChild(menu);

    requestAnimationFrame(() => {

        const menuWidth = menu.offsetWidth;
        const menuHeight = menu.offsetHeight;

        const viewportHeight = window.innerHeight;
        const viewportWidth = window.innerWidth;

        let top;
        let left;

        if (rect.bottom + menuHeight + 10 > viewportHeight) {
            top = rect.top - menuHeight - 6;
        } else {
            top = rect.bottom + 6;
        }

        left = rect.right - menuWidth;

        if (left < 8) left = 8;
        if (left + menuWidth > viewportWidth - 8) {
            left = viewportWidth - menuWidth - 8;
        }

        menu.style.top = top + "px";
        menu.style.left = left + "px";

        menu.style.visibility = "visible";
    });

    activeMenu = menu;
}

function closeMenu() {
    if (activeMenu) {
        activeMenu.remove();
        activeMenu = null;
    }
}

document.addEventListener('click', closeMenu);

/* API */
async function handleAction(url) {
    try {
        await fetch(url);
        fetchData();
    } catch (err) {
        console.error(err);
    }
}

function downloadItem(id) {
    handleAction(`/internal/api/download?action=download&type=internal&id=${id}`);
}

function downloadSymlink(id) {
    handleAction(`/internal/api/download?action=download&type=symlink&id=${id}`);
}

function downloadStrm(id) {
    handleAction(`/internal/api/download?action=download&type=strmlink&id=${id}`);
}

function resetDownload(id) {
    handleAction(`/internal/api/download?action=reset&id=${id}`);
}

function deleteDownload(id) {
    if (!confirm("Delete this download?")) return;
    handleAction(`/internal/api/download?action=delete&id=${id}`);
}

/* timer */
setInterval(() => {
    countdown--;
    timerEl.innerText = countdown;
    if (countdown <= 0) fetchData();
}, 1000);

fetchData();
</script>

</body>
</html>
