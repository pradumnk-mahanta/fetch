<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Settings</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<div class="container mx-auto px-3 md:px-4 py-6 md:py-8">

    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 pb-6 border-b border-gray-800">

        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">
                <span class="text-blue-500">Fetch</span> Settings
            </h1>
            <p class="text-xs text-gray-500 mt-1">
                Version: <span id="ver-tag" class="text-blue-400 font-mono"></span>
            </p>
        </div>

        <a href="/" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm">
            Back
        </a>

    </header>

    <form id="config-form" class="space-y-6">

        <!-- APP CORE -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 md:p-6 space-y-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Application Core</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Log Level</label>
                    <select id="log-level-select" name="application_log_level"
                        class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Categories (CSV)</label>
                    <input id="app-categories" name="application_categories"
                        class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- DOWNLOADER -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 md:p-6 space-y-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Downloader Core</h2>

            <div class="space-y-4">

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Active Downloader</label>
                    <select id="downloader-select" name="configured_downloader_id"
                        class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Max Parallel</label>
                        <input type="number" id="downloader_max_downloads_concurrent"
                            name="downloader_max_downloads_concurrent"
                            class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm">
                    </div>

                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Max Retry</label>
                        <input type="number" id="downloader_max_downloads_retry"
                            name="downloader_max_downloads_retry"
                            class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm">
                    </div>
                </div>

                <div id="downloader-description" class="text-xs text-gray-500"></div>

            </div>
        </div>

        <!-- PROVIDERS -->
        <section class="space-y-6">

            <!-- Debrid -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-gray-500 uppercase">Debrid Providers</h2>
                    <div class="flex gap-2">
                        <select id="supported-debrid-list"
                            class="bg-gray-800 border border-gray-700 text-xs rounded px-2 py-1"></select>
                        <button type="button" onclick="addProvider('debrid')"
                            class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs rounded">
                            Add
                        </button>
                    </div>
                </div>
                <div id="debrid-container" class="space-y-3"></div>
            </div>

            <!-- Usenet -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-gray-500 uppercase">Usenet Providers</h2>
                    <div class="flex gap-2">
                        <select id="supported-usenet-list"
                            class="bg-gray-800 border border-gray-700 text-xs rounded px-2 py-1"></select>
                        <button type="button" onclick="addProvider('usenet')"
                            class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs rounded">
                            Add
                        </button>
                    </div>
                </div>
                <div id="usenet-container" class="space-y-3"></div>
            </div>

        </section>

        <!-- SAVE -->
        <div class="pt-4">
            <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold">
                Save Configuration
            </button>
        </div>

    </form>

</div>

<script>
let fullConfig = {};

async function init() {
    const res = await fetch('/internal/api/config');
    fullConfig = await res.json();

    document.getElementById('ver-tag').innerText = fullConfig.version;
    document.getElementById('app-categories').value = fullConfig.application_categories;

    const logSelect = document.getElementById('log-level-select');
    logSelect.innerHTML = '';
    fullConfig.application_supported_log_level.forEach(lvl => {
        logSelect.innerHTML += `<option value="${lvl}" ${lvl === fullConfig.application_log_level ? 'selected' : ''}>${lvl}</option>`;
    });

    const downloaderSelect = document.getElementById('downloader-select');
    downloaderSelect.innerHTML = '';
    fullConfig.supported_downloaders.forEach(d => {
        downloaderSelect.innerHTML += `<option value="${d.downloader_id}">${d.downloader_name}</option>`;
    });

    downloaderSelect.value = fullConfig.configured_downloaders?.downloader_id;

    document.getElementById('downloader_max_downloads_concurrent').value =
        fullConfig.downloader_max_downloads_concurrent;

    document.getElementById('downloader_max_downloads_retry').value =
        fullConfig.downloader_max_downloads_retry;

    populateSupported('supported-debrid-list', fullConfig.supported_debrid_providers, 'debrid');
    populateSupported('supported-usenet-list', fullConfig.supported_usenet_providers, 'usenet');

    renderProviders('debrid', fullConfig.configured_debrid_providers);
    renderProviders('usenet', fullConfig.configured_usenet_providers);
}

function populateSupported(elId, list, type) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    list.forEach(p => {
        el.innerHTML += `<option value="${p[`${type}_provider_id`]}">${p[`${type}_provider_name`]}</option>`;
    });
}

function renderProviders(type, list) {
    const container = document.getElementById(`${type}-container`);

    container.innerHTML = list.map((p, i) => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">

            <div class="flex justify-between items-center">
                <span class="text-sm font-semibold text-white">${p[`${type}_provider_name`]}</span>
                <button onclick="removeProvider('${type}', ${i})"
                    class="text-xs text-red-400 hover:text-red-300">
                    Remove
                </button>
            </div>

            <input type="password" name="${type}[${i}].api_key"
                value="${p[`${type}_provider_api_key`] || ''}"
                placeholder="API Key"
                class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm">

            <div class="grid grid-cols-2 gap-2">
                <input type="number" name="${type}[${i}].priority"
                    value="${p.priority}"
                    placeholder="Priority"
                    class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm">

                <input type="number" name="${type}[${i}].max"
                    value="${p[`${type}_provider_max_send`]}"
                    placeholder="Max"
                    class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm">
            </div>

            <input type="text" name="${type}[${i}].mount"
                value="${p[`${type}_provider_rclone_mount`] || ''}"
                placeholder="Mount Path"
                class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm">

        </div>
    `).join('');
}

function addProvider(type) {
    const select = document.getElementById(`supported-${type}-list`);
    const id = select.value;

    const source = type === 'debrid'
        ? fullConfig.supported_debrid_providers
        : fullConfig.supported_usenet_providers;

    const template = source.find(p => p[`${type}_provider_id`] === id);

    const list = type === 'debrid'
        ? fullConfig.configured_debrid_providers
        : fullConfig.configured_usenet_providers;

    list.push({
        priority: list.length + 1,
        [`${type}_provider_id`]: template[`${type}_provider_id`],
        [`${type}_provider_name`]: template[`${type}_provider_name`],
        [`${type}_provider_api_key`]: "",
        [`${type}_provider_max_send`]: 2,
        [`${type}_provider_rclone_mount`]: ""
    });

    renderProviders(type, list);
}

function removeProvider(type, index) {
    const list = type === 'debrid'
        ? fullConfig.configured_debrid_providers
        : fullConfig.configured_usenet_providers;

    list.splice(index, 1);
    renderProviders(type, list);
}

document.getElementById('config-form').onsubmit = async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);

    const update = { ...fullConfig };
    update.application_log_level = formData.get('application_log_level');
    update.application_categories = formData.get('application_categories');

    await fetch('/internal/api/config/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(update)
    });

    alert("Saved");
};

init();
</script>

</body>
</html>
