<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Archives</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<div class="container mx-auto px-3 md:px-4 py-6 md:py-8">

    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 pb-6 border-b border-gray-800">

        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                <span class="text-blue-500">Fetch</span> Archives
            </h1>
            <p class="text-gray-500 text-xs md:text-sm mt-1">Completed & Stored Downloads</p>
        </div>

        <a href="/" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm">
            Back
        </a>

    </header>

    <!-- CONTENT -->
    <div id="archive-container" class="grid grid-cols-1 gap-4 md:gap-6">
        <div class="flex flex-col items-center justify-center py-20 text-gray-600">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p>Loading archives...</p>
        </div>
    </div>

</div>

<script>
const container = document.getElementById('archive-container');

function formatDate(dateStr) {
    if (!dateStr || dateStr.startsWith("0001")) return "N/A";
    return new Date(dateStr).toLocaleString();
}

async function fetchArchives() {
    try {
        const res = await fetch('/internal/api/archives');

        if (res.status === 401) {
            window.location.href = '/';
            return;
        }

        const data = await res.json();
        renderArchives(data);

    } catch (err) {
        console.error(err);
    }
}

function renderArchives(list) {

    if (!list || list.length === 0) {
        container.innerHTML = `
            <div class="text-center py-20 bg-gray-900 rounded-2xl border border-dashed border-gray-800 text-gray-500">
                No archived downloads found.
            </div>`;
        return;
    }

    container.innerHTML = list.map(dl => `

        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl">

            <div class="relative p-4 md:p-6">

                <!-- MENU BUTTON -->
                <button onclick="event.stopPropagation(); openMenu(event, '${dl.id}')"
                    class="absolute top-1/2 right-2 -translate-y-1/2 p-3 rounded-lg hover:bg-gray-800 text-gray-500 hover:text-white text-lg">
                    ⋮
                </button>

                <div class="pr-12">

                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-blue-900/40 text-blue-400 text-[10px] rounded border border-blue-800/50">
                            ${dl.protocol}
                        </span>
                        <span class="px-2 py-0.5 bg-gray-800 text-gray-400 text-[10px] rounded border border-gray-700">
                            ${dl.category || 'Default'}
                        </span>
                        <span class="px-2 py-0.5 bg-gray-800 text-gray-400 text-[10px] rounded border border-gray-700">
                            ${dl.provider || 'Unknown'}
                        </span>
                    </div>

                    <!-- FULL WRAP NAME -->
                    <h2 class="text-base md:text-lg font-semibold text-white whitespace-normal break-words leading-snug">
                        ${dl.download_name}
                    </h2>

                    <div class="text-xs text-gray-400 mt-2 flex flex-col gap-1">
                        <span>Added: ${formatDate(dl.added_at)}</span>
                        <span>Completed: ${formatDate(dl.completed_at)}</span>

                        ${dl.refresh ? `
                        <span class="text-blue-400">
                            Last Healthcheck: ${formatDate(dl.last_refresh_at)}
                        </span>` : ''}
                    </div>

                    <p class="text-xs mt-2 ${dl.status === 'Completed' ? 'text-green-500' : 'text-yellow-500'}">
                        ${dl.status}
                    </p>

                </div>

            </div>

        </div>

    `).join('');
}

/* MENU */
let activeMenu = null;

function openMenu(event, id) {
    closeMenu();

    const rect = event.target.getBoundingClientRect();

    const menu = document.createElement('div');
    menu.className = "fixed bg-gray-900 border border-gray-800 rounded-xl shadow-xl z-50 w-48";

    menu.style.visibility = "hidden";
    menu.style.top = "0px";
    menu.style.left = "0px";

    menu.innerHTML = `
        <div class="py-1">

            <button onclick="refreshDownload('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Refresh
            </button>

            <button onclick="downloadItem('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Download (Full)
            </button>

            <button onclick="downloadSymlink('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Download (Symlink)
            </button>

            <button onclick="downloadStrm('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800">
                Download (STRM)
            </button>

            <div class="border-t border-gray-800 my-1"></div>

            <button onclick="deleteDownload('${id}'); closeMenu()"
                class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-800">
                Delete
            </button>

        </div>
    `;

    document.body.appendChild(menu);

    requestAnimationFrame(() => {

        const menuWidth = menu.offsetWidth;
        const menuHeight = menu.offsetHeight;

        const viewportHeight = window.innerHeight;
        const viewportWidth = window.innerWidth;

        let top;
        let left;

        if (rect.bottom + menuHeight + 10 > viewportHeight) {
            top = rect.top - menuHeight - 6;
        } else {
            top = rect.bottom + 6;
        }

        left = rect.right - menuWidth;

        if (left < 8) left = 8;
        if (left + menuWidth > viewportWidth - 8) {
            left = viewportWidth - menuWidth - 8;
        }

        menu.style.top = top + "px";
        menu.style.left = left + "px";

        menu.style.visibility = "visible";
    });

    activeMenu = menu;
}

function closeMenu() {
    if (activeMenu) {
        activeMenu.remove();
        activeMenu = null;
    }
}

document.addEventListener('click', closeMenu);

/* ACTIONS */
async function handleAction(url, successMsg) {
    try {
        const res = await fetch(url);

        let message = successMsg;

        try {
            const data = await res.json();
            if (data.message) message = data.message;
        } catch (_) {}

        if (res.ok) {
            alert(message || "Success");
            fetchArchives();
        } else {
            alert(message || "Something went wrong!");
        }

    } catch (err) {
        console.error(err);
        alert("Request failed!");
    }
}

function downloadItem(id) {
    handleAction(`/internal/api/archive?action=download&type=internal&id=${id}`);
}

function downloadSymlink(id) {
    handleAction(`/internal/api/archive?action=download&type=symlink&id=${id}`);
}

function downloadStrm(id) {
    handleAction(`/internal/api/archive?action=download&type=strmlink&id=${id}`);
}

function refreshDownload(id) {
    handleAction(`/internal/api/archive?action=refresh&id=${id}`);
}

function deleteDownload(id) {
    if (!confirm("Delete this archive?")) return;
    handleAction(`/internal/api/archive?action=delete&id=${id}`);
}

fetchArchives();
</script>

</body>
</html>
