<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Archives</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<div class="container mx-auto px-4 py-8">

    <!-- Header -->
    <header class="flex justify-between items-center mb-10 pb-6 border-b border-gray-800">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">
                <span class="text-blue-500">Fetch</span> Archives
            </h1>
            <p class="text-gray-500 text-sm mt-1">Completed & Stored Downloads</p>
        </div>

        <div class="flex items-center gap-4">
            <a href="/" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm">Back to Dashboard</a>
        </div>
    </header>

    <!-- Content -->
    <div id="archive-container" class="grid grid-cols-1 gap-6">
        <div class="flex flex-col items-center justify-center py-20 text-gray-600">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p>Loading archives...</p>
        </div>
    </div>

</div>

<script>
const container = document.getElementById('archive-container');

async function fetchArchives() {
    try {
        const res = await fetch('/internal/api/archive');

        if (res.status === 401) {
            window.location.href = '/';
            return;
        }

        const data = await res.json();
        renderArchives(data);
    } catch (err) {
        console.error(err);
    }
}

function formatDate(dateStr) {
    if (!dateStr || dateStr.startsWith("0001")) return "N/A";
    return new Date(dateStr).toLocaleString();
}

function renderArchives(list) {
    if (!list || list.length === 0) {
        container.innerHTML = `
            <div class="text-center py-20 bg-gray-900 rounded-2xl border border-dashed border-gray-800 text-gray-500">
                No archived downloads found.
            </div>`;
        return;
    }

    container.innerHTML = list.map(dl => `
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl p-6 flex flex-col gap-4">

            <!-- Top -->
            <div class="flex justify-between items-start gap-4">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-blue-900/40 text-blue-400 text-[10px] font-bold rounded border border-blue-800/50">
                            ${dl.protocol}
                        </span>
                        <span class="px-2 py-0.5 bg-gray-800 text-gray-400 text-[10px] font-bold rounded border border-gray-700">
                            ${dl.category || 'Default'}
                        </span>
                        <span class="px-2 py-0.5 bg-gray-800 text-gray-400 text-[10px] font-bold rounded border border-gray-700">
                            ${dl.provider || 'Unknown'}
                        </span>
                    </div>

                    <h2 class="text-lg font-bold text-white">${dl.download_name}</h2>

                    <div class="text-xs text-gray-400 mt-2 space-y-1">
                        <p>Added: ${formatDate(dl.added_at)}</p>
                        <p>Completed: ${formatDate(dl.completed_at)}</p>
                        ${dl.refresh ? `
                            <p class="text-blue-400">
                                Last Refresh: ${formatDate(dl.last_refresh_at)}
                            </p>
                        ` : ''}
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-2">

                    <!-- Delete -->
                    <button onclick="deleteDownload('${dl.id}')"
                        class="p-2 text-red-400 bg-red-900/20 hover:bg-red-800/30 rounded-lg transition"
                        title="Delete">
                        
                        <svg xmlns="http://www.w3.org/2000/svg" 
                            class="h-5 w-5" 
                            fill="none" 
                            viewBox="0 0 24 24" 
                            stroke="currentColor">
                            
                            <!-- Lid -->
                            <path stroke-linecap="round" 
                                stroke-linejoin="round" 
                                stroke-width="2"
                                d="M4 7h16" />

                            <!-- Handle -->
                            <path stroke-linecap="round" 
                                stroke-linejoin="round" 
                                stroke-width="2"
                                d="M9 4h6" />

                            <!-- Bin body -->
                            <path stroke-linecap="round" 
                                stroke-linejoin="round" 
                                stroke-width="2"
                                d="M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12" />
                        </svg>

                    </button>                    

                    <!-- Restart -->
                    <button onclick="retryDownload('${dl.id}')"
                        class="p-2 text-orange-400 bg-orange-900/20 hover:bg-orange-800/30 rounded-lg transition"
                        title="Refresh Download">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/>
                        </svg>
                    </button>

                    <!-- Download -->
                    <a href="/internal/api/download?id=${dl.id}"
                        class="p-2 text-green-400 bg-green-900/20 hover:bg-green-800/30 rounded-lg transition"
                        title="Download with Internal Downloader">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 4v12m0 0l-4-4m4 4l4-4"/>
                        </svg>
                    </a>

                </div>
            </div>

            <!-- Bottom Row -->
            <div class="flex justify-between items-center border-t border-gray-800 pt-3">

                <span class="text-sm font-medium ${dl.status === 'Completed' ? 'text-green-500' : 'text-yellow-500'}">
                    ${dl.status}
                </span>

                <!-- Refresh Toggle -->
                <label class="flex items-center gap-2 cursor-pointer">
                    <span class="text-xs text-gray-400">Auto Refresh</span>
                    <input type="checkbox" ${dl.refresh ? 'checked' : ''}
                        onchange="toggleRefresh('${dl.id}', this.checked)"
                        class="toggle-checkbox hidden">

                    <div class="w-10 h-5 bg-gray-700 rounded-full relative">
                        <div class="dot absolute left-1 top-1 w-3 h-3 bg-white rounded-full transition 
                            ${dl.refresh ? 'translate-x-5' : ''}">
                        </div>
                    </div>
                </label>

            </div>

        </div>
    `).join('');
}

/* Actions */

async function deleteDownload(id) {
    if (!confirm("Delete this archive?")) return;
    await fetch(`/internal/api/delete?id=${id}`, { method: 'DELETE' });
    fetchArchives();
}

async function retryDownload(id) {
    await fetch(`/internal/api/retry?id=${id}`, { method: 'POST' });
    fetchArchives();
}

async function toggleRefresh(id, enabled) {
    await fetch(`/internal/api/refresh?id=${id}&enabled=${enabled}`, { method: 'POST' });
}

fetchArchives();
</script>

</body>
</html>
