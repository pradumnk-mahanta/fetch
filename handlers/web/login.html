<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen font-sans">
    
    <div class="w-full max-w-md p-10 bg-gray-900 rounded-2xl shadow-2xl border border-gray-800">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-white">
                <span class="text-blue-500">Fetch</span> Login
            </h1>
            <p class="text-gray-500 text-[10px] uppercase font-bold tracking-[0.2em] mt-3">Authentication Required</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            
            <div id="error-message" class="hidden p-4 bg-red-900/20 border border-red-500/50 text-red-400 text-xs font-bold rounded-xl text-center uppercase tracking-widest">
                Invalid username or password
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-widest ml-1">Username</label>
                <input type="text" name="username" required 
                       class="w-full p-4 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white placeholder-gray-700">
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-widest ml-1">Password</label>
                <input type="password" name="password" required 
                       class="w-full p-4 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white placeholder-gray-700">
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm uppercase tracking-widest rounded-xl shadow-lg transition duration-200 transform active:scale-95 mt-4">
                Sign In
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-message').classList.remove('hidden');
        }
    </script>
</body>
</html>
