<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch | Login</title>
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen font-sans px-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 space-y-6">

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">
                <span class="text-blue-500">Fetch</span> Login
            </h1>
            <p class="text-gray-500 text-xs mt-1">Authentication required</p>
        </div>

        <!-- Error -->
        <div id="error-message"
            class="hidden p-3 bg-red-900/20 border border-red-500/40 text-red-400 text-xs rounded-lg text-center">
            Invalid username or password
        </div>

        <!-- Form -->
        <form action="/login" method="POST" class="space-y-4">

            <div>
                <label class="text-xs text-gray-400 mb-1 block">Username</label>
                <input type="text" name="username" required
                    class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-400 mb-1 block">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold transition">
                Sign In
            </button>

        </form>

    </div>

<script>
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('error')) {
    document.getElementById('error-message').classList.remove('hidden');
}
</script>

</body>
</html>
